          package nl.marc.tvhome;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.nio.charset.StandardCharsets;
          import java.util.Locale;

          /** Haalt het weer op via Open-Meteo (gratis, geen API-sleutel nodig). */
          final class WeatherClient {

              static final class Weather {
                  String place;
                  double temp;
                  double min = Double.NaN;
                  double max = Double.NaN;
                  int code;
                  boolean isDay = true;
              }

              private WeatherClient() {}

              static Weather fetch(String city) throws Exception {
                  String geoUrl = "https://geocoding-api.open-meteo.com/v1/search?count=1&language=nl&format=json&name="
                          + URLEncoder.encode(city, "UTF-8");
                  JSONObject geo = new JSONObject(httpGet(geoUrl));
                  JSONArray results = geo.optJSONArray("results");
                  if (results == null || results.length() == 0) {
                      throw new IOException("Stad niet gevonden");
                  }
                  JSONObject place = results.getJSONObject(0);
                  double lat = place.getDouble("latitude");
                  double lon = place.getDouble("longitude");

                  String url = String.format(Locale.US,
                          "https://api.open-meteo.com/v1/forecast?latitude=%.4f&longitude=%.4f"
                                  + "&current=temperature_2m,weather_code,is_day"
                                  + "&daily=temperature_2m_max,temperature_2m_min"
                                  + "&forecast_days=1&timezone=auto",
                          lat, lon);
                  JSONObject json = new JSONObject(httpGet(url));
                  JSONObject current = json.getJSONObject("current");

                  Weather w = new Weather();
                  w.place = place.optString("name", city);
                  w.temp = current.getDouble("temperature_2m");
                  w.code = current.optInt("weather_code", 0);
                  w.isDay = current.optInt("is_day", 1) == 1;
                  JSONObject daily = json.optJSONObject("daily");
                  if (daily != null) {
                      JSONArray max = daily.optJSONArray("temperature_2m_max");
                      JSONArray min = daily.optJSONArray("temperature_2m_min");
                      if (max != null && max.length() > 0) w.max = max.optDouble(0);
                      if (min != null && min.length() > 0) w.min = min.optDouble(0);
                  }
                  return w;
              }

              static String describe(int code) {
                  switch (code) {
                      case 0: return "Helder";
                      case 1: return "Overwegend helder";
                      case 2: return "Half bewolkt";
                      case 3: return "Bewolkt";
                      case 45: case 48: return "Mist";
                      case 51: case 53: case 55: return "Motregen";
                      case 56: case 57: return "Ijzel";
                      case 61: return "Lichte regen";
                      case 63: return "Regen";
                      case 65: return "Zware regen";
                      case 66: case 67: return "IJzelregen";
                      case 71: return "Lichte sneeuw";
                      case 73: return "Sneeuw";
                      case 75: return "Zware sneeuw";
                      case 77: return "Sneeuwkorrels";
                      case 80: case 81: case 82: return "Regenbuien";
                      case 85: case 86: return "Sneeuwbuien";
                      case 95: return "Onweer";
                      case 96: case 99: return "Onweer met hagel";
                      default: return "";
                  }
              }

              static String emoji(int code, boolean isDay) {
                  if (code == 0 || code == 1) return isDay ? "☀️" : "🌙";
                  if (code == 2) return "⛅";
                  if (code == 3) return "☁️";
                  if (code == 45 || code == 48) return "🌫️";
                  if (code >= 51 && code <= 57) return "🌦️";
                  if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return "🌧️";
                  if ((code >= 71 && code <= 77) || code == 85 || code == 86) return "❄️";
                  if (code >= 95) return "⛈️";
                  return "";
              }

              static String httpGet(String url) throws IOException {
                  HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                  c.setConnectTimeout(10000);
                  c.setReadTimeout(15000);
                  c.setRequestProperty("User-Agent", "TvThuis/1.0");
                  try (InputStream in = c.getInputStream()) {
                      ByteArrayOutputStream out = new ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = in.read(buf)) != -1) out.write(buf, 0, n);
                      return new String(out.toByteArray(), StandardCharsets.UTF_8);
                  } finally {
                      c.disconnect();
                  }
              }
          }
