name: TV Thuis bouwen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle downloaden
        run: |
          curl -sSfL -o gradle.zip https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          rm gradle.zip
          echo "$RUNNER_TEMP/gradle-8.14.3/bin" >> "$GITHUB_PATH"

      - name: Android SDK controleren
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" || echo "SDK-installatie overgeslagen"

      - name: Projectbestanden aanmaken
        run: |
          cat > settings.gradle <<'TVTHUIS_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "TvThuis"
          include ':app'
          TVTHUIS_EOF
          cat > build.gradle <<'TVTHUIS_EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          TVTHUIS_EOF
          cat > gradle.properties <<'TVTHUIS_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          TVTHUIS_EOF
          mkdir -p app
          cat > app/build.gradle <<'TVTHUIS_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'nl.marc.tvhome'
              compileSdk 34

              defaultConfig {
                  applicationId 'nl.marc.tvhome'
                  minSdk 23
                  targetSdk 34
                  versionCode 2
                  versionName '1.1'
              }

              // Vaste sleutel, zodat een nieuwe versie gewoon over de oude heen installeert.
              signingConfigs {
                  thuis {
                      storeFile file('thuis.keystore')
                      storePassword 'tvthuis'
                      keyAlias 'tvthuis'
                      keyPassword 'tvthuis'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.thuis
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          TVTHUIS_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'TVTHUIS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission
                  android:name="android.permission.QUERY_ALL_PACKAGES"
                  tools:ignore="QueryAllPackagesPermission" />

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:banner="@drawable/banner"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboard|keyboardHidden|navigation|orientation|screenSize|screenLayout|smallestScreenSize|uiMode|density"
                      android:excludeFromRecents="true"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="landscape"
                      android:stateNotNeeded="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".AllAppsActivity"
                      android:configChanges="keyboard|keyboardHidden|navigation|orientation|screenSize|screenLayout|smallestScreenSize|uiMode|density"
                      android:excludeFromRecents="true"
                      android:exported="false"
                      android:screenOrientation="landscape" />
              </application>
          </manifest>
          TVTHUIS_EOF
          mkdir -p app/src/main/java/nl/marc/tvhome
          cat > app/src/main/java/nl/marc/tvhome/AllAppsActivity.java <<'TVTHUIS_EOF'
          package nl.marc.tvhome;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.util.TypedValue;
          import android.view.KeyEvent;
          import android.view.View;
          import android.widget.GridLayout;
          import android.widget.ImageView;
          import android.widget.TextView;

          import java.util.ArrayList;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Set;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          /** Scherm met alle apps. Hier maak je apps favoriet, verplaats je ze of verberg je ze. */
          public class AllAppsActivity extends Activity {

              private final ExecutorService io = Executors.newFixedThreadPool(2);

              private GridLayout grid;
              private TextView focusLabel;
              private List<AppStore.AppEntry> apps = new ArrayList<>();
              private String signature = "";
              private String focusedPkg;
              private int loadGeneration = 0;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_all_apps);
                  grid = findViewById(R.id.grid);
                  focusLabel = findViewById(R.id.focus_label);
                  Ui.applyBackground(this, (ImageView) findViewById(R.id.background), io);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  load(false);
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  io.shutdownNow();
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_MENU) {
                      AppStore.AppEntry e = find(focusedPkg);
                      if (e != null) {
                          showMenu(e);
                          return true;
                      }
                  }
                  return super.onKeyDown(keyCode, event);
              }

              private void load(final boolean force) {
                  final int gen = ++loadGeneration;
                  io.execute(() -> {
                      final List<AppStore.AppEntry> list = AppStore.queryAll(this);
                      final Set<String> favs = new HashSet<>(
                              AppStore.getList(AppStore.prefs(this), AppStore.PREF_FAVORITES));
                      runOnUiThread(() -> {
                          if (gen != loadGeneration || isDestroyed()) return;
                          String sig = AppStore.signature(list) + favs.hashCode();
                          if (!force && sig.equals(signature)) return;
                          signature = sig;
                          apps = list;
                          render(favs);
                      });
                  });
              }

              private void render(Set<String> favs) {
                  String restore = focusedPkg;
                  grid.removeAllViews();
                  int cols = Ui.columns(this);
                  grid.setColumnCount(cols);
                  int margin = Ui.dp(this, 9);
                  int tileW = Ui.tileWidth(this, cols);
                  int tileH = tileW * 9 / 16;

                  View toFocus = null;
                  for (final AppStore.AppEntry e : apps) {
                      View tile = Ui.appTile(this, e, tileH, favs.contains(e.pkg), new Ui.TileListener() {
                          @Override
                          public void onClick() {
                              AppStore.launch(AllAppsActivity.this, e);
                          }

                          @Override
                          public void onLongClick() {
                              showMenu(e);
                          }

                          @Override
                          public void onFocus(boolean focused) {
                              if (focused) {
                                  focusedPkg = e.pkg;
                                  focusLabel.setText(e.label);
                              }
                          }
                      });
                      GridLayout.LayoutParams lp = new GridLayout.LayoutParams();
                      lp.width = tileW;
                      lp.height = tileH;
                      lp.setMargins(margin, margin, margin, margin);
                      grid.addView(tile, lp);
                      if (toFocus == null && e.pkg.equals(restore)) toFocus = tile;
                  }

                  if (apps.isEmpty()) {
                      TextView empty = new TextView(this);
                      empty.setText("Geen apps gevonden.");
                      empty.setTextColor(0xB3FFFFFF);
                      empty.setTextSize(TypedValue.COMPLEX_UNIT_SP, 18);
                      grid.addView(empty);
                      return;
                  }
                  if (toFocus == null) toFocus = grid.getChildAt(0);
                  final View target = toFocus;
                  target.post(target::requestFocus);
              }

              private void showMenu(final AppStore.AppEntry e) {
                  final boolean fav = AppStore.isFavorite(this, e.pkg);
                  String[] items = {
                          fav ? "★ Uit favorieten halen" : "☆ Toevoegen aan favorieten",
                          "Naar het begin",
                          "Eén plek naar voren",
                          "Eén plek naar achteren",
                          "Verbergen",
                          "App-info",
                  };
                  Ui.dialog(this, e.label).setItems(items, (d, which) -> {
                      focusedPkg = e.pkg;
                      switch (which) {
                          case 0:
                              boolean now = AppStore.toggleFavorite(this, e.pkg);
                              Ui.toast(this, now ? e.label + " staat nu bij je favorieten"
                                      : e.label + " is uit je favorieten gehaald");
                              load(true);
                              break;
                          case 1:
                              AppStore.move(this, AppStore.PREF_ORDER, apps, e.pkg, Integer.MIN_VALUE);
                              load(true);
                              break;
                          case 2:
                              AppStore.move(this, AppStore.PREF_ORDER, apps, e.pkg, -1);
                              load(true);
                              break;
                          case 3:
                              AppStore.move(this, AppStore.PREF_ORDER, apps, e.pkg, 1);
                              load(true);
                              break;
                          case 4:
                              AppStore.hide(this, e.pkg);
                              focusedPkg = null;
                              Ui.toast(this, e.label + " is verborgen. Terugzetten kan via Aanpassen.");
                              load(true);
                              break;
                          case 5:
                              Ui.tryStart(this, new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS,
                                      Uri.fromParts("package", e.pkg, null)));
                              break;
                          default:
                              break;
                      }
                  }).show();
              }

              private AppStore.AppEntry find(String pkg) {
                  if (pkg == null) return null;
                  for (AppStore.AppEntry e : apps) if (e.pkg.equals(pkg)) return e;
                  return null;
              }
          }
          TVTHUIS_EOF
          mkdir -p app/src/main/java/nl/marc/tvhome
          cat > app/src/main/java/nl/marc/tvhome/AppStore.java <<'TVTHUIS_EOF'
          package nl.marc.tvhome;

          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ActivityInfo;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.drawable.Drawable;
          import android.text.TextUtils;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.Set;

          /** Apps opzoeken, favorieten, volgorde en verborgen apps. */
          final class AppStore {

              static final String PREFS = "tvthuis";
              static final String PREF_ORDER = "order";
              static final String PREF_HIDDEN = "hidden";
              static final String PREF_FAVORITES = "favorites";

              static final class AppEntry {
                  String pkg;
                  ComponentName component;
                  boolean leanback;
                  String label;
                  Drawable banner;
                  Drawable icon;
              }

              private AppStore() {}

              static SharedPreferences prefs(Context c) {
                  return c.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
              }

              // ------------------------------------------------------------------ opvragen

              /** Alle zichtbare apps, in de volgorde die de gebruiker heeft gekozen (rest op alfabet). */
              static List<AppEntry> queryAll(Context c) {
                  PackageManager pm = c.getPackageManager();
                  LinkedHashMap<String, AppEntry> map = new LinkedHashMap<>();
                  addApps(c, pm, Intent.CATEGORY_LEANBACK_LAUNCHER, true, map);
                  addApps(c, pm, Intent.CATEGORY_LAUNCHER, false, map);

                  SharedPreferences p = prefs(c);
                  Set<String> hidden = new HashSet<>(getList(p, PREF_HIDDEN));
                  List<AppEntry> result = new ArrayList<>();
                  for (String pkg : getList(p, PREF_ORDER)) {
                      AppEntry e = map.remove(pkg);
                      if (e != null && !hidden.contains(pkg)) result.add(e);
                  }
                  List<AppEntry> rest = new ArrayList<>();
                  for (AppEntry e : map.values()) {
                      if (!hidden.contains(e.pkg)) rest.add(e);
                  }
                  Collections.sort(rest, (a, b) -> a.label.compareToIgnoreCase(b.label));
                  result.addAll(rest);
                  return result;
              }

              /** De favorieten, in favorietenvolgorde. Apps die niet meer bestaan vallen weg. */
              static List<AppEntry> favorites(Context c, List<AppEntry> all) {
                  Map<String, AppEntry> byPkg = new HashMap<>();
                  for (AppEntry e : all) byPkg.put(e.pkg, e);
                  List<AppEntry> result = new ArrayList<>();
                  for (String pkg : getList(prefs(c), PREF_FAVORITES)) {
                      AppEntry e = byPkg.get(pkg);
                      if (e != null) result.add(e);
                  }
                  return result;
              }

              private static void addApps(Context c, PackageManager pm, String category, boolean leanback,
                                          LinkedHashMap<String, AppEntry> map) {
                  Intent i = new Intent(Intent.ACTION_MAIN).addCategory(category);
                  List<ResolveInfo> list;
                  try {
                      list = pm.queryIntentActivities(i, 0);
                  } catch (Exception ex) {
                      return;
                  }
                  for (ResolveInfo ri : list) {
                      ActivityInfo ai = ri.activityInfo;
                      if (ai == null) continue;
                      if (c.getPackageName().equals(ai.packageName) || map.containsKey(ai.packageName)) continue;

                      AppEntry e = new AppEntry();
                      e.pkg = ai.packageName;
                      e.component = new ComponentName(ai.packageName, ai.name);
                      e.leanback = leanback;
                      CharSequence label = ri.loadLabel(pm);
                      e.label = label == null ? ai.packageName : label.toString();
                      try {
                          e.banner = ai.loadBanner(pm);
                      } catch (Exception ignored) {
                      }
                      if (e.banner == null) {
                          try {
                              e.banner = pm.getApplicationBanner(ai.packageName);
                          } catch (Exception ignored) {
                          }
                      }
                      try {
                          e.icon = ri.loadIcon(pm);
                      } catch (Exception ignored) {
                      }
                      map.put(e.pkg, e);
                  }
              }

              static String signature(List<AppEntry> list) {
                  StringBuilder sb = new StringBuilder();
                  for (AppEntry e : list) {
                      sb.append(e.component.flattenToString()).append('|').append(e.label).append(';');
                  }
                  return sb.toString();
              }

              // ------------------------------------------------------------------ favorieten

              static boolean isFavorite(Context c, String pkg) {
                  return getList(prefs(c), PREF_FAVORITES).contains(pkg);
              }

              /** @return true als de app nu favoriet is. */
              static boolean toggleFavorite(Context c, String pkg) {
                  SharedPreferences p = prefs(c);
                  List<String> favs = getList(p, PREF_FAVORITES);
                  boolean nowFavorite;
                  if (favs.remove(pkg)) {
                      nowFavorite = false;
                  } else {
                      favs.add(pkg);
                      nowFavorite = true;
                  }
                  putList(p, PREF_FAVORITES, favs);
                  return nowFavorite;
              }

              /**
               * Verplaatst een app binnen een lijst (favorieten of de volgorde van alle apps).
               * delta = Integer.MIN_VALUE betekent: naar het begin.
               */
              static void move(Context c, String key, List<AppEntry> current, String pkg, int delta) {
                  List<String> order = new ArrayList<>();
                  for (AppEntry a : current) order.add(a.pkg);
                  int idx = order.indexOf(pkg);
                  if (idx < 0) return;
                  int target = delta == Integer.MIN_VALUE
                          ? 0
                          : Math.max(0, Math.min(order.size() - 1, idx + delta));
                  order.remove(idx);
                  order.add(target, pkg);
                  putList(prefs(c), key, order);
              }

              static void hide(Context c, String pkg) {
                  SharedPreferences p = prefs(c);
                  List<String> hidden = getList(p, PREF_HIDDEN);
                  if (!hidden.contains(pkg)) hidden.add(pkg);
                  putList(p, PREF_HIDDEN, hidden);
                  List<String> favs = getList(p, PREF_FAVORITES);
                  if (favs.remove(pkg)) putList(p, PREF_FAVORITES, favs);
              }

              // ------------------------------------------------------------------ starten

              static void launch(Activity a, AppEntry e) {
                  Intent i = new Intent(Intent.ACTION_MAIN);
                  i.addCategory(e.leanback ? Intent.CATEGORY_LEANBACK_LAUNCHER : Intent.CATEGORY_LAUNCHER);
                  i.setComponent(e.component);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED);
                  if (Ui.tryStart(a, i)) return;

                  PackageManager pm = a.getPackageManager();
                  Intent fallback = pm.getLeanbackLaunchIntentForPackage(e.pkg);
                  if (fallback == null) fallback = pm.getLaunchIntentForPackage(e.pkg);
                  if (fallback == null || !Ui.tryStart(a, fallback)) {
                      Ui.toast(a, e.label + " kon niet worden gestart");
                  }
              }

              // ------------------------------------------------------------------ lijsten in prefs

              static List<String> getList(SharedPreferences p, String key) {
                  String raw = p.getString(key, "");
                  List<String> out = new ArrayList<>();
                  for (String s : raw.split(",")) {
                      if (!s.trim().isEmpty()) out.add(s.trim());
                  }
                  return out;
              }

              static void putList(SharedPreferences p, String key, List<String> list) {
                  p.edit().putString(key, TextUtils.join(",", list)).apply();
              }
          }
          TVTHUIS_EOF
          mkdir -p app/src/main/java/nl/marc/tvhome
          cat > app/src/main/java/nl/marc/tvhome/MainActivity.java <<'TVTHUIS_EOF'
          package nl.marc.tvhome;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.BitmapFactory;
          import android.media.tv.TvContract;
          import android.media.tv.TvInputInfo;
          import android.media.tv.TvInputManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.provider.Settings;
          import android.text.InputType;
          import android.text.TextUtils;
          import android.view.KeyEvent;
          import android.view.View;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.GridLayout;
          import android.widget.ImageView;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.List;
          import java.util.Locale;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          /** Het home-scherm: klok, weer, knoppen en je favoriete apps. */
          public class MainActivity extends Activity {

              private static final int REQ_PICK_IMAGE = 42;
              private static final long WEATHER_REFRESH_MS = 30L * 60L * 1000L;
              private static final long MAX_IMAGE_BYTES = 25L * 1024L * 1024L;
              private static final String PREF_CITY = "city";

              private final ExecutorService io = Executors.newFixedThreadPool(2);
              private final Handler main = new Handler(Looper.getMainLooper());

              private SharedPreferences prefs;
              private ImageView background;
              private TextView weatherMain;
              private TextView weatherSub;
              private TextView focusLabel;
              private TextView emptyHint;
              private ScrollView scroll;
              private GridLayout grid;

              private List<AppStore.AppEntry> favorites = new ArrayList<>();
              private String favSignature = null;
              private String focusedPkg;
              private int loadGeneration = 0;
              private volatile long lastWeatherMs = 0;

              private final Runnable weatherTick = new Runnable() {
                  @Override
                  public void run() {
                      refreshWeather();
                      main.postDelayed(this, WEATHER_REFRESH_MS);
                  }
              };

              // ------------------------------------------------------------------ levenscyclus

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  prefs = AppStore.prefs(this);

                  background = findViewById(R.id.background);
                  weatherMain = findViewById(R.id.weather_main);
                  weatherSub = findViewById(R.id.weather_sub);
                  focusLabel = findViewById(R.id.focus_label);
                  emptyHint = findViewById(R.id.empty_hint);
                  scroll = findViewById(R.id.scroll);
                  grid = findViewById(R.id.grid);

                  setupButton(R.id.btn_all_apps, v -> openAllApps());
                  setupButton(R.id.btn_inputs, v -> showInputs());
                  setupButton(R.id.btn_settings, v -> openSystemSettings());
                  setupButton(R.id.btn_customize, v -> showCustomizeMenu());

                  Ui.applyBackground(this, background, io);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  loadFavorites(false);
                  if (lastWeatherMs == 0 || SystemClock.elapsedRealtime() - lastWeatherMs > WEATHER_REFRESH_MS / 2) {
                      refreshWeather();
                  }
                  main.removeCallbacks(weatherTick);
                  main.postDelayed(weatherTick, WEATHER_REFRESH_MS);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  main.removeCallbacks(weatherTick);
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  main.removeCallbacksAndMessages(null);
                  io.shutdownNow();
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  // Home-knop ingedrukt terwijl we al op het home-scherm staan: terug naar boven.
                  scroll.smoothScrollTo(0, 0);
                  if (grid.getChildCount() > 0) grid.getChildAt(0).requestFocus();
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  // Op het home-scherm doet de terug-knop niets.
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_MENU) {
                      AppStore.AppEntry e = findFavorite(focusedPkg);
                      View f = getCurrentFocus();
                      if (e != null && f != null && f.getParent() == grid) {
                          showFavoriteMenu(e);
                          return true;
                      }
                  }
                  return super.onKeyDown(keyCode, event);
              }

              // ------------------------------------------------------------------ knoppen

              private void setupButton(int id, View.OnClickListener l) {
                  View b = findViewById(id);
                  b.setOnClickListener(l);
                  b.setOnFocusChangeListener((v, has) -> Ui.animateFocus(v, has, 1.06f));
              }

              private void openAllApps() {
                  startActivity(new Intent(this, AllAppsActivity.class));
              }

              private void openSystemSettings() {
                  if (!Ui.tryStart(this, new Intent(Settings.ACTION_SETTINGS))) {
                      Ui.toast(this, "Instellingen konden niet worden geopend");
                  }
              }

              // ------------------------------------------------------------------ ingangen

              private void showInputs() {
                  final List<TvInputInfo> inputs = new ArrayList<>();
                  try {
                      TvInputManager tim = (TvInputManager) getSystemService(Context.TV_INPUT_SERVICE);
                      if (tim != null) {
                          for (TvInputInfo info : tim.getTvInputList()) {
                              if (info.isPassthroughInput() && !info.isHidden(this)) inputs.add(info);
                          }
                      }
                  } catch (Exception ignored) {
                      // Sommige tv's geven deze lijst niet vrij.
                  }

                  if (inputs.isEmpty()) {
                      openSystemInputs();
                      return;
                  }

                  List<String> labels = new ArrayList<>();
                  for (TvInputInfo info : inputs) {
                      CharSequence custom = info.loadCustomLabel(this);
                      CharSequence label = !TextUtils.isEmpty(custom) ? custom : info.loadLabel(this);
                      labels.add(label == null ? info.getId() : label.toString());
                  }
                  labels.add("Systeemmenu ingangen…");

                  Ui.dialog(this, "Ingang kiezen")
                          .setItems(labels.toArray(new String[0]), (d, which) -> {
                              if (which >= inputs.size()) {
                                  openSystemInputs();
                                  return;
                              }
                              Uri uri = TvContract.buildChannelUriForPassthroughInput(inputs.get(which).getId());
                              if (!Ui.tryStart(this, new Intent(Intent.ACTION_VIEW, uri))) {
                                  Ui.toast(this, "Deze ingang kon niet worden geopend");
                              }
                          })
                          .show();
              }

              private void openSystemInputs() {
                  String[] actions = {
                          "com.android.tv.action.VIEW_INPUTS",
                          "android.settings.INPUT_SETTINGS",
                  };
                  for (String a : actions) {
                      if (Ui.tryStart(this, new Intent(a))) return;
                  }
                  Ui.toast(this, "Geen ingangenmenu gevonden. Gebruik de ingangsknop op je afstandsbediening.");
              }

              // ------------------------------------------------------------------ favorieten

              private void loadFavorites(final boolean force) {
                  final int gen = ++loadGeneration;
                  io.execute(() -> {
                      final List<AppStore.AppEntry> favs = AppStore.favorites(this, AppStore.queryAll(this));
                      runOnUiThread(() -> {
                          if (gen != loadGeneration || isDestroyed()) return;
                          String sig = AppStore.signature(favs);
                          if (!force && sig.equals(favSignature)) return;
                          favSignature = sig;
                          favorites = favs;
                          renderFavorites();
                      });
                  });
              }

              private void renderFavorites() {
                  String restore = focusedPkg;
                  grid.removeAllViews();

                  int cols = Ui.columns(this);
                  grid.setColumnCount(cols);
                  int margin = Ui.dp(this, 9);
                  int tileW = Ui.tileWidth(this, cols);
                  int tileH = tileW * 9 / 16;

                  View toFocus = null;
                  for (final AppStore.AppEntry e : favorites) {
                      View tile = Ui.appTile(this, e, tileH, false, new Ui.TileListener() {
                          @Override
                          public void onClick() {
                              AppStore.launch(MainActivity.this, e);
                          }

                          @Override
                          public void onLongClick() {
                              showFavoriteMenu(e);
                          }

                          @Override
                          public void onFocus(boolean focused) {
                              if (focused) {
                                  focusedPkg = e.pkg;
                                  focusLabel.setText(e.label);
                              } else if (e.pkg.equals(focusedPkg)) {
                                  focusLabel.setText("");
                              }
                          }
                      });
                      addTile(tile, tileW, tileH, margin);
                      if (toFocus == null && e.pkg.equals(restore)) toFocus = tile;
                  }

                  // Laatste tegel: naar alle apps.
                  View allTile = Ui.actionTile(this, R.drawable.ic_apps, "Alle apps", tileH, new Ui.TileListener() {
                      @Override
                      public void onClick() {
                          openAllApps();
                      }

                      @Override
                      public void onLongClick() {
                          openAllApps();
                      }

                      @Override
                      public void onFocus(boolean focused) {
                          focusedPkg = null;
                          focusLabel.setText(focused ? "Alle apps bekijken" : "");
                      }
                  });
                  addTile(allTile, tileW, tileH, margin);

                  emptyHint.setVisibility(favorites.isEmpty() ? View.VISIBLE : View.GONE);

                  if (toFocus == null) toFocus = grid.getChildAt(0);
                  final View target = toFocus;
                  target.post(target::requestFocus);
              }

              private void addTile(View tile, int w, int h, int margin) {
                  GridLayout.LayoutParams lp = new GridLayout.LayoutParams();
                  lp.width = w;
                  lp.height = h;
                  lp.setMargins(margin, margin, margin, margin);
                  grid.addView(tile, lp);
              }

              private void showFavoriteMenu(final AppStore.AppEntry e) {
                  String[] items = {
                          "★ Uit favorieten halen",
                          "Naar het begin",
                          "Eén plek naar voren",
                          "Eén plek naar achteren",
                          "App-info",
                  };
                  Ui.dialog(this, e.label).setItems(items, (d, which) -> {
                      focusedPkg = e.pkg;
                      switch (which) {
                          case 0:
                              AppStore.toggleFavorite(this, e.pkg);
                              focusedPkg = null;
                              loadFavorites(true);
                              break;
                          case 1:
                              AppStore.move(this, AppStore.PREF_FAVORITES, favorites, e.pkg, Integer.MIN_VALUE);
                              loadFavorites(true);
                              break;
                          case 2:
                              AppStore.move(this, AppStore.PREF_FAVORITES, favorites, e.pkg, -1);
                              loadFavorites(true);
                              break;
                          case 3:
                              AppStore.move(this, AppStore.PREF_FAVORITES, favorites, e.pkg, 1);
                              loadFavorites(true);
                              break;
                          case 4:
                              Ui.tryStart(this, new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS,
                                      Uri.fromParts("package", e.pkg, null)));
                              break;
                          default:
                              break;
                      }
                  }).show();
              }

              private AppStore.AppEntry findFavorite(String pkg) {
                  if (pkg == null) return null;
                  for (AppStore.AppEntry e : favorites) if (e.pkg.equals(pkg)) return e;
                  return null;
              }

              // ------------------------------------------------------------------ aanpassen

              private void showCustomizeMenu() {
                  String city = prefs.getString(PREF_CITY, "");
                  String[] items = {
                          "Stad voor het weer: " + (city.isEmpty() ? "(niet ingesteld)" : city),
                          "Achtergrond",
                          "Aantal apps per rij: " + Ui.columns(this),
                          "Verborgen apps terugzetten",
                          "Volgorde van alle apps herstellen",
                  };
                  Ui.dialog(this, "Aanpassen").setItems(items, (d, which) -> {
                      switch (which) {
                          case 0: askCity(); break;
                          case 1: showBackgroundMenu(); break;
                          case 2: askColumns(); break;
                          case 3:
                              prefs.edit().remove(AppStore.PREF_HIDDEN).apply();
                              Ui.toast(this, "Alle apps zijn weer zichtbaar");
                              loadFavorites(true);
                              break;
                          case 4:
                              prefs.edit().remove(AppStore.PREF_ORDER).apply();
                              Ui.toast(this, "Alle apps staan weer op alfabet");
                              break;
                          default: break;
                      }
                  }).show();
              }

              private void askCity() {
                  askText("Stad voor het weer", "Bijvoorbeeld: Utrecht",
                          prefs.getString(PREF_CITY, ""), InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_FLAG_CAP_WORDS,
                          value -> {
                              prefs.edit().putString(PREF_CITY, value.trim()).apply();
                              lastWeatherMs = 0;
                              weatherMain.setText("");
                              weatherSub.setText("Weer laden…");
                              refreshWeather();
                          });
              }

              private void askColumns() {
                  final int[] options = {4, 5, 6, 7};
                  String[] labels = {"4", "5", "6", "7"};
                  int current = Arrays.binarySearch(options, Ui.columns(this));
                  Ui.dialog(this, "Aantal apps per rij").setSingleChoiceItems(labels, Math.max(current, 0), (d, which) -> {
                      prefs.edit().putInt(Ui.PREF_COLUMNS, options[which]).apply();
                      d.dismiss();
                      renderFavorites();
                  }).show();
              }

              // ------------------------------------------------------------------ achtergrond

              private void showBackgroundMenu() {
                  String[] items = {
                          "Donker verloop (standaard)",
                          "Zwart",
                          "Nachtblauw",
                          "Afbeelding van internet (adres)",
                          "Afbeelding uit bestanden op de tv",
                  };
                  Ui.dialog(this, "Achtergrond").setItems(items, (d, which) -> {
                      switch (which) {
                          case 0: setBackgroundMode("gradient"); break;
                          case 1: setBackgroundMode("black"); break;
                          case 2: setBackgroundMode("navy"); break;
                          case 3: askImageUrl(); break;
                          case 4: pickImage(); break;
                          default: break;
                      }
                  }).show();
              }

              private void setBackgroundMode(String mode) {
                  prefs.edit().putString(Ui.PREF_BG, mode).apply();
                  Ui.applyBackground(this, background, io);
              }

              private void askImageUrl() {
                  askText("Adres van de afbeelding", "https://…/foto.jpg", "",
                          InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_URI,
                          value -> {
                              final String url = value.trim();
                              if (url.isEmpty()) return;
                              Ui.toast(this, "Afbeelding downloaden…");
                              io.execute(() -> {
                                  try {
                                      HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                                      c.setInstanceFollowRedirects(true);
                                      c.setConnectTimeout(10000);
                                      c.setReadTimeout(30000);
                                      c.setRequestProperty("User-Agent", "TvThuis/1.0");
                                      try (InputStream in = c.getInputStream()) {
                                          saveBackground(in);
                                      } finally {
                                          c.disconnect();
                                      }
                                      runOnUiThread(() -> setBackgroundMode("image"));
                                  } catch (Exception ex) {
                                      runOnUiThread(() -> Ui.toast(this, "Downloaden mislukt: " + ex.getMessage()));
                                  }
                              });
                          });
              }

              private void pickImage() {
                  Intent open = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  open.addCategory(Intent.CATEGORY_OPENABLE);
                  open.setType("image/*");
                  try {
                      startActivityForResult(open, REQ_PICK_IMAGE);
                      return;
                  } catch (ActivityNotFoundException ignored) {
                  }
                  Intent get = new Intent(Intent.ACTION_GET_CONTENT);
                  get.addCategory(Intent.CATEGORY_OPENABLE);
                  get.setType("image/*");
                  try {
                      startActivityForResult(get, REQ_PICK_IMAGE);
                  } catch (ActivityNotFoundException ex) {
                      Ui.toast(this, "Deze tv heeft geen bestandskiezer. Gebruik een afbeelding van internet.");
                  }
              }

              @Override
              @SuppressWarnings("deprecation")
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != REQ_PICK_IMAGE || resultCode != RESULT_OK || data == null || data.getData() == null) {
                      return;
                  }
                  final Uri uri = data.getData();
                  io.execute(() -> {
                      try (InputStream in = getContentResolver().openInputStream(uri)) {
                          if (in == null) throw new IOException("Bestand niet leesbaar");
                          saveBackground(in);
                          runOnUiThread(() -> setBackgroundMode("image"));
                      } catch (Exception ex) {
                          runOnUiThread(() -> Ui.toast(this, "Afbeelding laden mislukt: " + ex.getMessage()));
                      }
                  });
              }

              private void saveBackground(InputStream in) throws IOException {
                  File tmp = new File(getFilesDir(), "achtergrond.tmp");
                  long total = 0;
                  try (OutputStream out = new FileOutputStream(tmp)) {
                      byte[] buf = new byte[16384];
                      int n;
                      while ((n = in.read(buf)) != -1) {
                          total += n;
                          if (total > MAX_IMAGE_BYTES) throw new IOException("Afbeelding is te groot (max 25 MB)");
                          out.write(buf, 0, n);
                      }
                  } catch (IOException ex) {
                      //noinspection ResultOfMethodCallIgnored
                      tmp.delete();
                      throw ex;
                  }
                  BitmapFactory.Options o = new BitmapFactory.Options();
                  o.inJustDecodeBounds = true;
                  BitmapFactory.decodeFile(tmp.getAbsolutePath(), o);
                  if (o.outWidth <= 0) {
                      //noinspection ResultOfMethodCallIgnored
                      tmp.delete();
                      throw new IOException("Dit is geen geldige afbeelding");
                  }
                  File dest = Ui.backgroundFile(this);
                  //noinspection ResultOfMethodCallIgnored
                  dest.delete();
                  if (!tmp.renameTo(dest)) throw new IOException("Opslaan mislukt");
              }

              // ------------------------------------------------------------------ weer

              private void refreshWeather() {
                  final String city = prefs.getString(PREF_CITY, "").trim();
                  if (city.isEmpty()) {
                      weatherMain.setText("");
                      weatherSub.setText("Kies je stad via Aanpassen voor het weer");
                      return;
                  }
                  io.execute(() -> {
                      try {
                          final WeatherClient.Weather w = WeatherClient.fetch(city);
                          lastWeatherMs = SystemClock.elapsedRealtime();
                          runOnUiThread(() -> showWeather(w));
                      } catch (Exception ex) {
                          runOnUiThread(() -> {
                              if (TextUtils.isEmpty(weatherMain.getText())) {
                                  weatherSub.setText("Weer niet beschikbaar (" + city + ")");
                              }
                          });
                      }
                  });
              }

              private void showWeather(WeatherClient.Weather w) {
                  if (isDestroyed()) return;
                  String emoji = WeatherClient.emoji(w.code, w.isDay);
                  weatherMain.setText(String.format(Locale.getDefault(), "%s %d°",
                          emoji, Math.round(w.temp)).trim());
                  StringBuilder sub = new StringBuilder();
                  String desc = WeatherClient.describe(w.code);
                  if (!desc.isEmpty()) sub.append(desc).append("  ·  ");
                  if (!Double.isNaN(w.min) && !Double.isNaN(w.max)) {
                      sub.append(String.format(Locale.getDefault(), "%d° / %d°  ·  ",
                              Math.round(w.min), Math.round(w.max)));
                  }
                  sub.append(w.place);
                  weatherSub.setText(sub.toString());
              }

              // ------------------------------------------------------------------ hulpjes

              interface TextCallback {
                  void onText(String value);
              }

              private void askText(String title, String hint, String value, int inputType, final TextCallback cb) {
                  final EditText input = new EditText(this);
                  input.setHint(hint);
                  input.setText(value);
                  input.setInputType(inputType);
                  input.setSingleLine(true);
                  input.setSelection(input.getText().length());
                  FrameLayout box = new FrameLayout(this);
                  box.setPadding(Ui.dp(this, 24), Ui.dp(this, 8), Ui.dp(this, 24), 0);
                  box.addView(input);
                  Ui.dialog(this, title)
                          .setView(box)
                          .setPositiveButton("Opslaan", (d, w) -> cb.onText(input.getText().toString()))
                          .setNegativeButton("Annuleren", null)
                          .show();
                  input.requestFocus();
              }
          }
