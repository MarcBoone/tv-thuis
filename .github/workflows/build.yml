          package nl.marc.tvhome;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ActivityNotFoundException;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.drawable.ColorDrawable;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.GradientDrawable;
          import android.text.TextUtils;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.File;
          import java.util.concurrent.ExecutorService;

          /** Gedeelde stukjes interface: tegels, dialogen, achtergrond. */
          final class Ui {

              static final String PREF_BG = "bg_mode";
              static final String PREF_COLUMNS = "columns";

              interface TileListener {
                  void onClick();

                  void onLongClick();

                  void onFocus(boolean focused);
              }

              private Ui() {}

              // ------------------------------------------------------------------ algemeen

              static int dp(Context c, int v) {
                  return Math.round(TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v,
                          c.getResources().getDisplayMetrics()));
              }

              static void toast(Context c, String msg) {
                  Toast.makeText(c, msg, Toast.LENGTH_LONG).show();
              }

              static boolean tryStart(Context c, Intent i) {
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  try {
                      c.startActivity(i);
                      return true;
                  } catch (ActivityNotFoundException | SecurityException ex) {
                      return false;
                  }
              }

              static AlertDialog.Builder dialog(Context c, String title) {
                  return new AlertDialog.Builder(c, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                          .setTitle(title);
              }

              static void animateFocus(View v, boolean focused, float scale) {
                  float s = focused ? scale : 1f;
                  v.animate().scaleX(s).scaleY(s)
                          .translationZ(focused ? dp(v.getContext(), 8) : 0)
                          .setDuration(150).start();
              }

              // ------------------------------------------------------------------ tegels

              static int columns(Context c) {
                  return AppStore.prefs(c).getInt(PREF_COLUMNS, 5);
              }

              /** Breedte van één tegel, uitgaande van 48dp zijmarge en 9dp marge rond elke tegel. */
              static int tileWidth(Context c, int cols) {
                  int avail = c.getResources().getDisplayMetrics().widthPixels - 2 * dp(c, 48);
                  return avail / cols - 2 * dp(c, 9);
              }

              static FrameLayout baseTile(Context c, String description, final TileListener l) {
                  FrameLayout tile = new FrameLayout(c);
                  tile.setFocusable(true);
                  tile.setClickable(true);
                  tile.setLongClickable(true);
                  tile.setContentDescription(description);

                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(0xFF1C2029);
                  bg.setCornerRadius(dp(c, 10));
                  tile.setBackground(bg);
                  tile.setClipToOutline(true);
                  tile.setForeground(c.getDrawable(R.drawable.tile_focus));

                  tile.setOnClickListener(v -> l.onClick());
                  tile.setOnLongClickListener(v -> {
                      l.onLongClick();
                      return true;
                  });
                  tile.setOnFocusChangeListener((v, has) -> {
                      animateFocus(v, has, 1.08f);
                      l.onFocus(has);
                  });
                  return tile;
              }

              static View appTile(Context c, AppStore.AppEntry e, int tileH, boolean favorite, TileListener l) {
                  FrameLayout tile = baseTile(c, e.label, l);
                  if (e.banner != null) {
                      ImageView iv = new ImageView(c);
                      iv.setScaleType(ImageView.ScaleType.CENTER_CROP);
                      iv.setImageDrawable(e.banner);
                      tile.addView(iv, matchParent());
                  } else {
                      tile.addView(iconAndLabel(c, e.icon, e.label, tileH), matchParent());
                  }
                  if (favorite) {
                      TextView star = new TextView(c);
                      star.setText("★");
                      star.setTextColor(0xFFFFD25A);
                      star.setTextSize(TypedValue.COMPLEX_UNIT_SP, 16);
                      star.setGravity(Gravity.CENTER);
                      GradientDrawable dot = new GradientDrawable();
                      dot.setShape(GradientDrawable.OVAL);
                      dot.setColor(0xB3000000);
                      star.setBackground(dot);
                      int s = dp(c, 26);
                      FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(s, s, Gravity.TOP | Gravity.END);
                      lp.setMargins(0, dp(c, 6), dp(c, 6), 0);
                      tile.addView(star, lp);
                  }
                  return tile;
              }

              static View actionTile(Context c, int iconRes, String label, int tileH, TileListener l) {
                  FrameLayout tile = baseTile(c, label, l);
                  Drawable icon = c.getDrawable(iconRes);
                  tile.addView(iconAndLabel(c, icon, label, tileH), matchParent());
                  return tile;
              }

              private static View iconAndLabel(Context c, Drawable icon, String text, int tileH) {
                  LinearLayout col = new LinearLayout(c);
                  col.setOrientation(LinearLayout.VERTICAL);
                  col.setGravity(Gravity.CENTER);
                  col.setPadding(dp(c, 8), dp(c, 6), dp(c, 8), dp(c, 6));

                  ImageView iv = new ImageView(c);
                  iv.setImageDrawable(icon);
                  int s = (int) (tileH * 0.42f);
                  col.addView(iv, new LinearLayout.LayoutParams(s, s));

                  TextView label = new TextView(c);
                  label.setText(text);
                  label.setTextColor(0xFFFFFFFF);
                  label.setTextSize(TypedValue.COMPLEX_UNIT_SP, 14);
                  label.setSingleLine(true);
                  label.setEllipsize(TextUtils.TruncateAt.END);
                  label.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  lp.topMargin = dp(c, 6);
                  col.addView(label, lp);
                  return col;
              }

              private static FrameLayout.LayoutParams matchParent() {
                  return new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT);
              }

              // ------------------------------------------------------------------ achtergrond

              static File backgroundFile(Context c) {
                  return new File(c.getFilesDir(), "achtergrond.img");
              }

              static void applyBackground(final Activity a, final ImageView target, ExecutorService io) {
                  String mode = AppStore.prefs(a).getString(PREF_BG, "gradient");
                  if ("image".equals(mode) && backgroundFile(a).exists()) {
                      final File f = backgroundFile(a);
                      final int w = a.getResources().getDisplayMetrics().widthPixels;
                      final int h = a.getResources().getDisplayMetrics().heightPixels;
                      io.execute(() -> {
                          final Bitmap bmp = decodeSampled(f, w, h);
                          a.runOnUiThread(() -> {
                              if (a.isDestroyed()) return;
                              if (bmp != null) {
                                  target.setImageBitmap(bmp);
                              } else {
                                  target.setImageDrawable(presetDrawable("gradient"));
                              }
                          });
                      });
                      return;
                  }
                  target.setImageDrawable(presetDrawable(mode));
              }

              static Drawable presetDrawable(String mode) {
                  if ("black".equals(mode)) return new ColorDrawable(0xFF000000);
                  int[] colors = "navy".equals(mode)
                          ? new int[]{0xFF12264A, 0xFF050A16, 0xFF020308}
                          : new int[]{0xFF1E2430, 0xFF0C0F15, 0xFF050608};
                  return new GradientDrawable(GradientDrawable.Orientation.TL_BR, colors);
              }

              static Bitmap decodeSampled(File f, int reqW, int reqH) {
                  BitmapFactory.Options o = new BitmapFactory.Options();
                  o.inJustDecodeBounds = true;
                  BitmapFactory.decodeFile(f.getAbsolutePath(), o);
                  if (o.outWidth <= 0 || o.outHeight <= 0) return null;
                  int sample = 1;
                  while (o.outWidth / (sample * 2) >= reqW && o.outHeight / (sample * 2) >= reqH) sample *= 2;
                  BitmapFactory.Options o2 = new BitmapFactory.Options();
                  o2.inSampleSize = sample;
                  try {
                      return BitmapFactory.decodeFile(f.getAbsolutePath(), o2);
                  } catch (OutOfMemoryError err) {
                      return null;
                  }
              }
          }
