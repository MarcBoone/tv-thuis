name: TV Thuis bouwen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Projectbestanden aanmaken
        run: |
          cat > settings.gradle <<'TVTHUIS_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "TvThuis"
          include ':app'
          TVTHUIS_EOF
          cat > build.gradle <<'TVTHUIS_EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          TVTHUIS_EOF
          cat > gradle.properties <<'TVTHUIS_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          TVTHUIS_EOF
          mkdir -p app
          cat > app/build.gradle <<'TVTHUIS_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'nl.marc.tvhome'
              compileSdk 34

              defaultConfig {
                  applicationId 'nl.marc.tvhome'
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          TVTHUIS_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'TVTHUIS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission
                  android:name="android.permission.QUERY_ALL_PACKAGES"
                  tools:ignore="QueryAllPackagesPermission" />

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:banner="@drawable/banner"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboard|keyboardHidden|navigation|orientation|screenSize|screenLayout|smallestScreenSize|uiMode|density"
                      android:excludeFromRecents="true"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="landscape"
                      android:stateNotNeeded="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          TVTHUIS_EOF
          mkdir -p app/src/main/java/nl/marc/tvhome
          cat > app/src/main/java/nl/marc/tvhome/MainActivity.java <<'TVTHUIS_EOF'
          package nl.marc.tvhome;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ActivityNotFoundException;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ActivityInfo;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.drawable.ColorDrawable;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.GradientDrawable;
          import android.media.tv.TvContract;
          import android.media.tv.TvInputInfo;
          import android.media.tv.TvInputManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.provider.Settings;
          import android.text.InputType;
          import android.text.TextUtils;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.GridLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Collections;
          import java.util.HashSet;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Set;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class MainActivity extends Activity {

              private static final int REQ_PICK_IMAGE = 42;
              private static final long WEATHER_REFRESH_MS = 30L * 60L * 1000L;
              private static final long MAX_IMAGE_BYTES = 25L * 1024L * 1024L;

              private static final String PREF_CITY = "city";
              private static final String PREF_BG = "bg_mode";
              private static final String PREF_COLUMNS = "columns";
              private static final String PREF_ORDER = "order";
              private static final String PREF_HIDDEN = "hidden";

              private final ExecutorService io = Executors.newFixedThreadPool(2);
              private final Handler main = new Handler(Looper.getMainLooper());

              private SharedPreferences prefs;
              private ImageView background;
              private TextView weatherMain;
              private TextView weatherSub;
              private TextView focusLabel;
              private ScrollView scroll;
              private GridLayout grid;

              private List<AppEntry> apps = new ArrayList<>();
              private String appsSignature = "";
              private String focusedPkg;
              private int loadGeneration = 0;
              private volatile long lastWeatherMs = 0;

              private final Runnable weatherTick = new Runnable() {
                  @Override
                  public void run() {
                      refreshWeather();
                      main.postDelayed(this, WEATHER_REFRESH_MS);
                  }
              };

              static final class AppEntry {
                  String pkg;
                  ComponentName component;
                  boolean leanback;
                  String label;
                  Drawable banner;
                  Drawable icon;
              }

              // ------------------------------------------------------------------ levenscyclus

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  prefs = getSharedPreferences("tvthuis", MODE_PRIVATE);

                  background = findViewById(R.id.background);
                  weatherMain = findViewById(R.id.weather_main);
                  weatherSub = findViewById(R.id.weather_sub);
                  focusLabel = findViewById(R.id.focus_label);
                  scroll = findViewById(R.id.scroll);
                  grid = findViewById(R.id.grid);

                  setupButton(R.id.btn_inputs, v -> showInputs());
                  setupButton(R.id.btn_settings, v -> openSystemSettings());
                  setupButton(R.id.btn_customize, v -> showCustomizeMenu());

                  applyBackground();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  loadApps(false);
                  if (SystemClock.elapsedRealtime() - lastWeatherMs > WEATHER_REFRESH_MS / 2 || lastWeatherMs == 0) {
                      refreshWeather();
                  }
                  main.removeCallbacks(weatherTick);
                  main.postDelayed(weatherTick, WEATHER_REFRESH_MS);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  main.removeCallbacks(weatherTick);
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  main.removeCallbacksAndMessages(null);
                  io.shutdownNow();
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  // Home-knop ingedrukt terwijl we al op het home-scherm staan: terug naar boven.
                  scroll.smoothScrollTo(0, 0);
                  if (grid.getChildCount() > 0) grid.getChildAt(0).requestFocus();
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  // Op het home-scherm doet de terug-knop niets.
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_MENU) {
                      AppEntry e = findApp(focusedPkg);
                      View f = getCurrentFocus();
                      if (e != null && f != null && f.getParent() == grid) {
                          showAppMenu(e);
                          return true;
                      }
                  }
                  return super.onKeyDown(keyCode, event);
              }

              // ------------------------------------------------------------------ knoppen

              private void setupButton(int id, View.OnClickListener l) {
                  View b = findViewById(id);
                  b.setOnClickListener(l);
                  b.setOnFocusChangeListener((v, has) -> animateFocus(v, has, 1.06f));
              }

              private void openSystemSettings() {
                  if (!tryStart(new Intent(Settings.ACTION_SETTINGS))) {
                      toast("Instellingen konden niet worden geopend");
                  }
              }

              // ------------------------------------------------------------------ ingangen

              private void showInputs() {
                  final List<TvInputInfo> inputs = new ArrayList<>();
                  try {
                      TvInputManager tim = (TvInputManager) getSystemService(Context.TV_INPUT_SERVICE);
                      if (tim != null) {
                          for (TvInputInfo info : tim.getTvInputList()) {
                              if (info.isPassthroughInput() && !info.isHidden(this)) inputs.add(info);
                          }
                      }
                  } catch (Exception ignored) {
                      // Sommige tv's geven deze lijst niet vrij.
                  }

                  if (inputs.isEmpty()) {
                      openSystemInputs();
                      return;
                  }

                  List<String> labels = new ArrayList<>();
                  for (TvInputInfo info : inputs) {
                      CharSequence custom = info.loadCustomLabel(this);
                      CharSequence label = !TextUtils.isEmpty(custom) ? custom : info.loadLabel(this);
                      labels.add(label == null ? info.getId() : label.toString());
                  }
                  labels.add("Systeemmenu ingangen…");

                  dialog("Ingang kiezen")
                          .setItems(labels.toArray(new String[0]), (d, which) -> {
                              if (which >= inputs.size()) {
                                  openSystemInputs();
                                  return;
                              }
                              Uri uri = TvContract.buildChannelUriForPassthroughInput(inputs.get(which).getId());
                              if (!tryStart(new Intent(Intent.ACTION_VIEW, uri))) {
                                  toast("Deze ingang kon niet worden geopend");
                              }
                          })
                          .show();
              }

              private void openSystemInputs() {
                  String[] actions = {
                          "com.android.tv.action.VIEW_INPUTS",
                          "android.settings.INPUT_SETTINGS",
                  };
                  for (String a : actions) {
                      if (tryStart(new Intent(a))) return;
                  }
                  toast("Geen ingangenmenu gevonden. Gebruik de ingangsknop op je afstandsbediening.");
              }

              // ------------------------------------------------------------------ apps

              private void loadApps(final boolean force) {
                  final int gen = ++loadGeneration;
                  io.execute(() -> {
                      final List<AppEntry> list = queryApps();
                      runOnUiThread(() -> {
                          if (gen != loadGeneration || isDestroyed()) return;
                          String sig = signature(list);
                          if (!force && sig.equals(appsSignature)) return;
                          appsSignature = sig;
                          apps = list;
                          renderGrid();
                      });
                  });
              }

              private List<AppEntry> queryApps() {
                  PackageManager pm = getPackageManager();
                  LinkedHashMap<String, AppEntry> map = new LinkedHashMap<>();
                  addApps(pm, Intent.CATEGORY_LEANBACK_LAUNCHER, true, map);
                  addApps(pm, Intent.CATEGORY_LAUNCHER, false, map);

                  Set<String> hidden = new HashSet<>(getList(PREF_HIDDEN));
                  List<AppEntry> result = new ArrayList<>();
                  for (String pkg : getList(PREF_ORDER)) {
                      AppEntry e = map.remove(pkg);
                      if (e != null && !hidden.contains(pkg)) result.add(e);
                  }
                  List<AppEntry> rest = new ArrayList<>();
                  for (AppEntry e : map.values()) {
                      if (!hidden.contains(e.pkg)) rest.add(e);
                  }
                  Collections.sort(rest, (a, b) -> a.label.compareToIgnoreCase(b.label));
                  result.addAll(rest);
                  return result;
              }

              private void addApps(PackageManager pm, String category, boolean leanback,
                                   LinkedHashMap<String, AppEntry> map) {
                  Intent i = new Intent(Intent.ACTION_MAIN).addCategory(category);
                  List<ResolveInfo> list;
                  try {
                      list = pm.queryIntentActivities(i, 0);
                  } catch (Exception ex) {
                      return;
                  }
                  for (ResolveInfo ri : list) {
                      ActivityInfo ai = ri.activityInfo;
                      if (ai == null) continue;
                      if (getPackageName().equals(ai.packageName) || map.containsKey(ai.packageName)) continue;

                      AppEntry e = new AppEntry();
                      e.pkg = ai.packageName;
                      e.component = new ComponentName(ai.packageName, ai.name);
                      e.leanback = leanback;
                      CharSequence label = ri.loadLabel(pm);
                      e.label = label == null ? ai.packageName : label.toString();
                      try {
                          e.banner = ai.loadBanner(pm);
                      } catch (Exception ignored) {
                      }
                      if (e.banner == null) {
                          try {
                              e.banner = pm.getApplicationBanner(ai.packageName);
                          } catch (Exception ignored) {
                          }
                      }
                      try {
                          e.icon = ri.loadIcon(pm);
                      } catch (Exception ignored) {
                      }
                      map.put(e.pkg, e);
                  }
              }

              private static String signature(List<AppEntry> list) {
                  StringBuilder sb = new StringBuilder();
                  for (AppEntry e : list) sb.append(e.component.flattenToString()).append('|').append(e.label).append(';');
                  return sb.toString();
              }

              private void renderGrid() {
                  String restoreFocus = focusedPkg;
                  grid.removeAllViews();

                  int cols = prefs.getInt(PREF_COLUMNS, 5);
                  grid.setColumnCount(cols);

                  int margin = dp(9);
                  int sidePadding = 2 * dp(48);
                  int avail = getResources().getDisplayMetrics().widthPixels - sidePadding;
                  int tileW = avail / cols - 2 * margin;
                  int tileH = tileW * 9 / 16;

                  View toFocus = null;
                  for (AppEntry e : apps) {
                      View tile = makeTile(e, tileH);
                      GridLayout.LayoutParams lp = new GridLayout.LayoutParams();
                      lp.width = tileW;
                      lp.height = tileH;
                      lp.setMargins(margin, margin, margin, margin);
                      grid.addView(tile, lp);
                      if (toFocus == null && e.pkg.equals(restoreFocus)) toFocus = tile;
                  }

                  if (apps.isEmpty()) {
                      TextView empty = new TextView(this);
                      empty.setText("Geen apps gevonden.");
                      empty.setTextColor(0xB3FFFFFF);
                      empty.setTextSize(TypedValue.COMPLEX_UNIT_SP, 18);
                      grid.addView(empty);
                      findViewById(R.id.btn_settings).requestFocus();
                      return;
                  }

                  if (toFocus == null) toFocus = grid.getChildAt(0);
                  final View target = toFocus;
                  target.post(target::requestFocus);
              }

              private View makeTile(final AppEntry e, int tileH) {
                  FrameLayout tile = new FrameLayout(this);
                  tile.setFocusable(true);
                  tile.setClickable(true);
                  tile.setLongClickable(true);
                  tile.setContentDescription(e.label);

                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(0xFF1C2029);
                  bg.setCornerRadius(dp(10));
                  tile.setBackground(bg);
                  tile.setClipToOutline(true);
                  tile.setForeground(getDrawable(R.drawable.tile_focus));

                  if (e.banner != null) {
                      ImageView iv = new ImageView(this);
                      iv.setScaleType(ImageView.ScaleType.CENTER_CROP);
                      iv.setImageDrawable(e.banner);
                      tile.addView(iv, new FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  } else {
                      LinearLayout col = new LinearLayout(this);
                      col.setOrientation(LinearLayout.VERTICAL);
                      col.setGravity(Gravity.CENTER);
                      col.setPadding(dp(8), dp(6), dp(8), dp(6));

                      ImageView icon = new ImageView(this);
                      icon.setImageDrawable(e.icon);
                      int s = (int) (tileH * 0.42f);
                      col.addView(icon, new LinearLayout.LayoutParams(s, s));

                      TextView label = new TextView(this);
                      label.setText(e.label);
                      label.setTextColor(0xFFFFFFFF);
                      label.setTextSize(TypedValue.COMPLEX_UNIT_SP, 14);
                      label.setSingleLine(true);
                      label.setEllipsize(TextUtils.TruncateAt.END);
                      label.setGravity(Gravity.CENTER);
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                      lp.topMargin = dp(6);
                      col.addView(label, lp);

                      tile.addView(col, new FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  }

                  tile.setOnClickListener(v -> launch(e));
                  tile.setOnLongClickListener(v -> {
                      showAppMenu(e);
                      return true;
                  });
                  tile.setOnFocusChangeListener((v, has) -> {
                      animateFocus(v, has, 1.08f);
                      if (has) {
                          focusedPkg = e.pkg;
                          focusLabel.setText(e.label);
                      } else if (e.pkg.equals(focusedPkg)) {
                          focusLabel.setText("");
                      }
                  });
                  return tile;
              }

              private void launch(AppEntry e) {
                  Intent i = new Intent(Intent.ACTION_MAIN);
                  i.addCategory(e.leanback ? Intent.CATEGORY_LEANBACK_LAUNCHER : Intent.CATEGORY_LAUNCHER);
                  i.setComponent(e.component);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED);
                  if (tryStart(i)) return;

                  PackageManager pm = getPackageManager();
                  Intent fallback = pm.getLeanbackLaunchIntentForPackage(e.pkg);
                  if (fallback == null) fallback = pm.getLaunchIntentForPackage(e.pkg);
                  if (fallback == null || !tryStart(fallback)) toast(e.label + " kon niet worden gestart");
              }

              private void showAppMenu(final AppEntry e) {
                  String[] items = {
                          "Naar het begin",
                          "Eén plek naar voren",
                          "Eén plek naar achteren",
                          "Verbergen",
                          "App-info",
                  };
                  dialog(e.label).setItems(items, (d, which) -> {
                      switch (which) {
                          case 0: moveApp(e.pkg, Integer.MIN_VALUE); break;
                          case 1: moveApp(e.pkg, -1); break;
                          case 2: moveApp(e.pkg, 1); break;
                          case 3: hideApp(e); break;
                          case 4:
                              tryStart(new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS,
                                      Uri.fromParts("package", e.pkg, null)));
                              break;
                          default: break;
                      }
                  }).show();
              }

              private void moveApp(String pkg, int delta) {
                  List<String> order = new ArrayList<>();
                  for (AppEntry a : apps) order.add(a.pkg);
                  int idx = order.indexOf(pkg);
                  if (idx < 0) return;
                  int target = delta == Integer.MIN_VALUE ? 0 : Math.max(0, Math.min(order.size() - 1, idx + delta));
                  order.remove(idx);
                  order.add(target, pkg);
                  putList(PREF_ORDER, order);
                  focusedPkg = pkg;
                  loadApps(true);
              }

              private void hideApp(AppEntry e) {
                  List<String> hidden = getList(PREF_HIDDEN);
                  if (!hidden.contains(e.pkg)) hidden.add(e.pkg);
                  putList(PREF_HIDDEN, hidden);
                  toast(e.label + " is verborgen. Terugzetten kan via Aanpassen.");
                  loadApps(true);
              }

              private AppEntry findApp(String pkg) {
                  if (pkg == null) return null;
                  for (AppEntry e : apps) if (e.pkg.equals(pkg)) return e;
                  return null;
              }

              // ------------------------------------------------------------------ aanpassen

              private void showCustomizeMenu() {
                  String city = prefs.getString(PREF_CITY, "");
                  String[] items = {
                          "Stad voor het weer: " + (city.isEmpty() ? "(niet ingesteld)" : city),
                          "Achtergrond",
                          "Aantal apps per rij: " + prefs.getInt(PREF_COLUMNS, 5),
                          "Verborgen apps terugzetten",
                          "Volgorde van apps herstellen",
                  };
                  dialog("Aanpassen").setItems(items, (d, which) -> {
                      switch (which) {
                          case 0: askCity(); break;
                          case 1: showBackgroundMenu(); break;
                          case 2: askColumns(); break;
                          case 3:
                              prefs.edit().remove(PREF_HIDDEN).apply();
                              toast("Alle apps zijn weer zichtbaar");
                              loadApps(true);
                              break;
                          case 4:
                              prefs.edit().remove(PREF_ORDER).apply();
                              toast("Apps staan weer op alfabet");
                              loadApps(true);
                              break;
                          default: break;
                      }
                  }).show();
              }

              private void askCity() {
                  askText("Stad voor het weer", "Bijvoorbeeld: Utrecht",
                          prefs.getString(PREF_CITY, ""), InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_FLAG_CAP_WORDS,
                          value -> {
                              prefs.edit().putString(PREF_CITY, value.trim()).apply();
                              lastWeatherMs = 0;
                              weatherMain.setText("");
                              weatherSub.setText("Weer laden…");
                              refreshWeather();
                          });
              }

              private void askColumns() {
                  final int[] options = {4, 5, 6, 7};
                  String[] labels = {"4", "5", "6", "7"};
                  int current = Arrays.binarySearch(options, prefs.getInt(PREF_COLUMNS, 5));
                  dialog("Aantal apps per rij").setSingleChoiceItems(labels, Math.max(current, 0), (d, which) -> {
                      prefs.edit().putInt(PREF_COLUMNS, options[which]).apply();
                      d.dismiss();
                      renderGrid();
                  }).show();
              }

              // ------------------------------------------------------------------ achtergrond

              private void showBackgroundMenu() {
                  String[] items = {
                          "Donker verloop (standaard)",
                          "Zwart",
                          "Nachtblauw",
                          "Afbeelding van internet (adres)",
                          "Afbeelding uit bestanden op de tv",
                  };
                  dialog("Achtergrond").setItems(items, (d, which) -> {
                      switch (which) {
                          case 0: setBackgroundMode("gradient"); break;
                          case 1: setBackgroundMode("black"); break;
                          case 2: setBackgroundMode("navy"); break;
                          case 3: askImageUrl(); break;
                          case 4: pickImage(); break;
                          default: break;
                      }
                  }).show();
              }

              private void setBackgroundMode(String mode) {
                  prefs.edit().putString(PREF_BG, mode).apply();
                  applyBackground();
              }

              private File backgroundFile() {
                  return new File(getFilesDir(), "achtergrond.img");
              }

              private void applyBackground() {
                  String mode = prefs.getString(PREF_BG, "gradient");
                  if ("image".equals(mode) && backgroundFile().exists()) {
                      final File f = backgroundFile();
                      final int w = getResources().getDisplayMetrics().widthPixels;
                      final int h = getResources().getDisplayMetrics().heightPixels;
                      io.execute(() -> {
                          final Bitmap bmp = decodeSampled(f, w, h);
                          runOnUiThread(() -> {
                              if (isDestroyed()) return;
                              if (bmp != null) {
                                  background.setImageBitmap(bmp);
                              } else {
                                  toast("Afbeelding kon niet worden gelezen");
                                  background.setImageDrawable(presetDrawable("gradient"));
                              }
                          });
                      });
                      return;
                  }
                  background.setImageDrawable(presetDrawable(mode));
              }

              private static Drawable presetDrawable(String mode) {
                  if ("black".equals(mode)) return new ColorDrawable(0xFF000000);
                  int[] colors = "navy".equals(mode)
                          ? new int[]{0xFF12264A, 0xFF050A16, 0xFF020308}
                          : new int[]{0xFF1E2430, 0xFF0C0F15, 0xFF050608};
                  return new GradientDrawable(GradientDrawable.Orientation.TL_BR, colors);
              }

              private static Bitmap decodeSampled(File f, int reqW, int reqH) {
                  BitmapFactory.Options o = new BitmapFactory.Options();
                  o.inJustDecodeBounds = true;
                  BitmapFactory.decodeFile(f.getAbsolutePath(), o);
                  if (o.outWidth <= 0 || o.outHeight <= 0) return null;
                  int sample = 1;
                  while (o.outWidth / (sample * 2) >= reqW && o.outHeight / (sample * 2) >= reqH) sample *= 2;
                  BitmapFactory.Options o2 = new BitmapFactory.Options();
                  o2.inSampleSize = sample;
                  try {
                      return BitmapFactory.decodeFile(f.getAbsolutePath(), o2);
                  } catch (OutOfMemoryError err) {
                      return null;
                  }
              }

              private void askImageUrl() {
                  askText("Adres van de afbeelding", "https://…/foto.jpg", "",
                          InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_URI,
                          value -> {
                              final String url = value.trim();
                              if (url.isEmpty()) return;
                              toast("Afbeelding downloaden…");
                              io.execute(() -> {
                                  try {
                                      HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                                      c.setInstanceFollowRedirects(true);
                                      c.setConnectTimeout(10000);
                                      c.setReadTimeout(30000);
                                      c.setRequestProperty("User-Agent", "TvThuis/1.0");
                                      try (InputStream in = c.getInputStream()) {
                                          saveBackground(in);
                                      } finally {
                                          c.disconnect();
                                      }
                                      runOnUiThread(() -> setBackgroundMode("image"));
                                  } catch (Exception ex) {
                                      runOnUiThread(() -> toast("Downloaden mislukt: " + ex.getMessage()));
                                  }
                              });
                          });
              }

              private void pickImage() {
                  Intent open = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  open.addCategory(Intent.CATEGORY_OPENABLE);
                  open.setType("image/*");
                  try {
                      startActivityForResult(open, REQ_PICK_IMAGE);
                      return;
                  } catch (ActivityNotFoundException ignored) {
                  }
                  Intent get = new Intent(Intent.ACTION_GET_CONTENT);
                  get.addCategory(Intent.CATEGORY_OPENABLE);
                  get.setType("image/*");
                  try {
                      startActivityForResult(get, REQ_PICK_IMAGE);
                  } catch (ActivityNotFoundException ex) {
                      toast("Deze tv heeft geen bestandskiezer. Gebruik een afbeelding van internet.");
                  }
              }

              @Override
              @SuppressWarnings("deprecation")
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != REQ_PICK_IMAGE || resultCode != RESULT_OK || data == null || data.getData() == null) {
                      return;
                  }
                  final Uri uri = data.getData();
                  io.execute(() -> {
                      try (InputStream in = getContentResolver().openInputStream(uri)) {
                          if (in == null) throw new IOException("Bestand niet leesbaar");
                          saveBackground(in);
                          runOnUiThread(() -> setBackgroundMode("image"));
                      } catch (Exception ex) {
                          runOnUiThread(() -> toast("Afbeelding laden mislukt: " + ex.getMessage()));
                      }
                  });
              }

              private void saveBackground(InputStream in) throws IOException {
                  File tmp = new File(getFilesDir(), "achtergrond.tmp");
                  long total = 0;
                  try (OutputStream out = new FileOutputStream(tmp)) {
                      byte[] buf = new byte[16384];
                      int n;
                      while ((n = in.read(buf)) != -1) {
                          total += n;
                          if (total > MAX_IMAGE_BYTES) throw new IOException("Afbeelding is te groot (max 25 MB)");
                          out.write(buf, 0, n);
                      }
                  } catch (IOException ex) {
                      //noinspection ResultOfMethodCallIgnored
                      tmp.delete();
                      throw ex;
                  }
                  BitmapFactory.Options o = new BitmapFactory.Options();
                  o.inJustDecodeBounds = true;
                  BitmapFactory.decodeFile(tmp.getAbsolutePath(), o);
                  if (o.outWidth <= 0) {
                      //noinspection ResultOfMethodCallIgnored
                      tmp.delete();
                      throw new IOException("Dit is geen geldige afbeelding");
                  }
                  File dest = backgroundFile();
                  //noinspection ResultOfMethodCallIgnored
                  dest.delete();
                  if (!tmp.renameTo(dest)) throw new IOException("Opslaan mislukt");
              }

              // ------------------------------------------------------------------ weer

              private void refreshWeather() {
                  final String city = prefs.getString(PREF_CITY, "").trim();
                  if (city.isEmpty()) {
                      weatherMain.setText("");
                      weatherSub.setText("Kies je stad via Aanpassen voor het weer");
                      return;
                  }
                  io.execute(() -> {
                      try {
                          final WeatherClient.Weather w = WeatherClient.fetch(city);
                          lastWeatherMs = SystemClock.elapsedRealtime();
                          runOnUiThread(() -> showWeather(w));
                      } catch (Exception ex) {
                          runOnUiThread(() -> {
                              if (TextUtils.isEmpty(weatherMain.getText())) {
                                  weatherSub.setText("Weer niet beschikbaar (" + city + ")");
                              }
                          });
                      }
                  });
              }

              private void showWeather(WeatherClient.Weather w) {
                  if (isDestroyed()) return;
                  String emoji = WeatherClient.emoji(w.code, w.isDay);
                  weatherMain.setText(String.format(Locale.getDefault(), "%s %d°",
                          emoji, Math.round(w.temp)).trim());
                  StringBuilder sub = new StringBuilder();
                  String desc = WeatherClient.describe(w.code);
                  if (!desc.isEmpty()) sub.append(desc).append("  ·  ");
                  if (!Double.isNaN(w.min) && !Double.isNaN(w.max)) {
                      sub.append(String.format(Locale.getDefault(), "%d° / %d°  ·  ",
                              Math.round(w.min), Math.round(w.max)));
                  }
                  sub.append(w.place);
                  weatherSub.setText(sub.toString());
              }

              // ------------------------------------------------------------------ hulpjes

              interface TextCallback {
                  void onText(String value);
              }

              private void askText(String title, String hint, String value, int inputType, final TextCallback cb) {
                  final EditText input = new EditText(this);
                  input.setHint(hint);
                  input.setText(value);
                  input.setInputType(inputType);
                  input.setSingleLine(true);
                  input.setSelection(input.getText().length());
                  FrameLayout box = new FrameLayout(this);
                  box.setPadding(dp(24), dp(8), dp(24), 0);
                  box.addView(input);
                  dialog(title)
                          .setView(box)
                          .setPositiveButton("Opslaan", (d, w) -> cb.onText(input.getText().toString()))
                          .setNegativeButton("Annuleren", null)
                          .show();
                  input.requestFocus();
              }

              private AlertDialog.Builder dialog(String title) {
                  return new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                          .setTitle(title);
              }

              private boolean tryStart(Intent i) {
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  try {
                      startActivity(i);
                      return true;
                  } catch (ActivityNotFoundException | SecurityException ex) {
                      return false;
                  }
              }

              private void animateFocus(View v, boolean focused, float scale) {
                  float s = focused ? scale : 1f;
                  v.animate().scaleX(s).scaleY(s).translationZ(focused ? dp(8) : 0).setDuration(150).start();
              }

              private List<String> getList(String key) {
                  String raw = prefs.getString(key, "");
                  List<String> out = new ArrayList<>();
                  for (String s : raw.split(",")) if (!s.trim().isEmpty()) out.add(s.trim());
                  return out;
              }

              private void putList(String key, List<String> list) {
                  prefs.edit().putString(key, TextUtils.join(",", list)).apply();
              }

              private int dp(int v) {
                  return Math.round(TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v,
                          getResources().getDisplayMetrics()));
              }

              private void toast(String msg) {
                  Toast.makeText(this, msg, Toast.LENGTH_LONG).show();
              }
          }
